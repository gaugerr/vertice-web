name: Export captured Vértice video
on:
  push:
    branches: [video/shopping-demo-20261029]
    paths:
      - '.github/workflows/encode-demo-video.yml'
      - 'tools/encode-demo.py'
permissions:
  contents: read
  actions: read
jobs:
  encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - name: Retrieve preserved captured scenes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40882530571 --repo gaugerr/vertice-web --name vertice-captured-scenes --dir video-output
      - name: Encode with streaming frames and verify MP4
        run: python3 -u tools/encode-demo.py
      - name: Deliver completed video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vertice-video-final
          path: |
            video-output/*.mp4
            video-output/*.txt
            video-output/*.srt
            video-output/*.jpg
            video-output/verificacao.json
          retention-days: 30
