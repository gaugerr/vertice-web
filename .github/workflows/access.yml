name: Access integration
on:
  push:
    branches: [feat/google-access, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --yes supabase@2.54.11 --help
      - run: npx --yes supabase@2.54.11 start --help
      - name: Start isolated Supabase
        run: npx --yes supabase@2.54.11 start --exclude studio,imgproxy,mailpit,storage-api,realtime,postgres-meta,logflare,vector,supavisor
      - run: npx --yes supabase@2.54.11 test db
      - name: Generate ephemeral signing key and local identities
        run: |
          node tools/create-access-key.mjs
          npx --yes supabase@2.54.11 status -o json > /tmp/vertice-supabase-status.json
          node tools/access-fixtures.mjs
      - name: Serve authenticated license functions
        run: |
          npx --yes supabase@2.54.11 functions serve --env-file .secrets/license.env > /tmp/vertice-functions.log 2>&1 &
          node tools/wait-access.mjs
      - id: build_access
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Login, license and offline integration
        if: ${{ !cancelled() && steps.build_access.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-access
        run: npx playwright test --config playwright.access.config.ts --output=test-results-access
      - name: Existing purchasing suite with an authenticated local customer
        if: ${{ !cancelled() && steps.build_access.outcome == 'success' }}
        env:
          ACCESS_INTEGRATION: '1'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-browser-results
          path: |
            playwright-report/
            test-results/
            playwright-report-access/
            test-results-access/
          retention-days: 7
      - name: Stop isolated services
        if: always()
        run: npx --yes supabase@2.54.11 stop --no-backup
