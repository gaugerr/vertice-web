name: Film Vértice spreadsheet
on:
  push:
    branches: [video/shopping-demo-20261029]
    paths: ['tools/sheet-video.py', '.github/workflows/sheet-video.yml']
permissions:
  contents: read
  actions: read
jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install desktop capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-calc libreoffice-l10n-pt-br python3-uno python3-pil python3-xlib xvfb xdotool ffmpeg fonts-crosextra-carlito python3-venv
          python3 -m venv /tmp/drive-download
          /tmp/drive-download/bin/pip install gdown
      - name: Download official Excel template into temporary workspace
        run: |
          /tmp/drive-download/bin/gdown 'https://drive.google.com/uc?id=1wGGyAMfwU6yVzaZHfx7KGcNi8Yo0AsPY' -O sheet.xlsx
      - name: Retrieve approved brand closing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40944623257 --repo gaugerr/vertice-web --name vertice-video-audio-legendas --dir prior
      - name: Film real spreadsheet
        run: xvfb-run -a -s "-screen 0 1600x1000x24" /usr/bin/python3 tools/sheet-video.py
      - name: Deliver finished video only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Vertice-planilha-video
          path: sheet-output/Vertice-Planilha.mp4
          if-no-files-found: ignore
          retention-days: 30
