name: Capture final Vértice scenes
on:
  push:
    branches: [video/shopping-demo-20261029]
    paths:
      - '.github/workflows/render-demo-video.yml'
      - 'tools/video/**'
permissions:
  contents: read
concurrency:
  group: vertice-demo-video
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_ACCESS_MODE: legacy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install pinned application and rendering tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil python3-venv fonts-dejavu-core
          python3 -m venv /tmp/vertice-voice
          /tmp/vertice-voice/bin/pip install edge-tts
          npx playwright install --with-deps chromium
      - name: Build isolated local demonstration
        run: npm run build
      - name: Record real app interactions
        env:
          DEMO_CAPTURE_ONLY: '1'
        run: node tools/video/render-demo.mjs
      - name: Preserve captured scenes before encoding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vertice-captured-scenes
          path: |
            video-output/frames/
            video-output/*.ffconcat
            video-output/capture.json
          retention-days: 2
      - name: Encode smooth video
        run: python3 tools/encode-demo.py
      - name: Add Brazilian narration and synchronized subtitles
        run: /tmp/vertice-voice/bin/python tools/video-voice.py
      - name: Deliver edited video with audio and captions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vertice-video-audio-legendas
          path: |
            video-output/vertice-com-audio-e-legendas.mp4
            video-output/vertice-lista-de-compras-1080x1920.mp4
            video-output/narracao-pt-BR.wav
            video-output/legendas-sincronizadas.srt
            video-output/verificacao-audio.json
            video-output/previa-legendas.jpg
          retention-days: 30
