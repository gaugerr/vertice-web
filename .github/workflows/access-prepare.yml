name: Prepare access dependencies
on:
  push:
    branches: [feat/google-access]
    paths: [.github/workflows/access-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          tar -czf /tmp/access-dependencies.tar.gz node_modules
          split -b 24000000 /tmp/access-dependencies.tar.gz /tmp/deps-part-
      - uses: actions/upload-artifact@v4
        with:
          name: access-dependencies-a
          path: /tmp/deps-part-aa
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: access-dependencies-b
          path: /tmp/deps-part-ab
          retention-days: 1
