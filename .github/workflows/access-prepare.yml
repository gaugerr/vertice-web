name: Prepare access dependencies
on:
  push:
    branches: [feat/google-access]
    paths: [.github/workflows/access-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --save-exact @supabase/supabase-js@2.57.4 jose@6.1.0 --ignore-scripts --no-audit --no-fund
      - run: npx --yes supabase@2.54.11 --help
      - run: test -d supabase/migrations || npx --yes supabase@2.54.11 migration new google_licenses
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json supabase/migrations
          git diff --cached --quiet || git commit -m 'chore: pin access dependencies and generate migration [skip ci]'
          git push
      - run: |\n          tar -czf /tmp/access-dependencies.tar.gz node_modules\n          split -b 24000000 /tmp/access-dependencies.tar.gz /tmp/deps-part-
      - uses: actions/upload-artifact@v4
        with:
          name: access-dependencies-a
          path: /tmp/deps-part-aa
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: access-dependencies-b
          path: /tmp/deps-part-ab
          retention-days: 1
